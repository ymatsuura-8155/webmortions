    svg#scene path,
    svg#scene line,
    svg#scene circle,
    svg#scene ellipse,
    svg#scene rect,
    svg#scene polyline {
      fill: none;
      stroke-linecap: round;

    svg#scene.filter-ink   .c-green,
    svg#scene.filter-blue  .c-ink,
    svg#scene.filter-blue  .c-green,
    svg#scene.filter-green .c-ink,
    svg#scene.filter-green .c-blue {
      opacity: 0.1 !important;
      transition: opacity 0.25s ease;
    }
  </style>

    <div class="flex flex-wrap items-center justify-between gap-2 pt-1 text-xs">
      <div class="flex items-center gap-1.5">
        <button id="btnReplay" class="px-2.5 py-1 rounded bg-[#2B5B8E] text-white font-medium hover:opacity-90 transition cursor-pointer">もう一度描く</button>
        <button id="btnPause" class="px-2 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:opacity-85 transition cursor-pointer">一時停止</button>
        <button id="btnInstant" class="px-2 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:opacity-85 transition cursor-pointer">完成</button>
      </div>

      <div class="flex items-center gap-2 text-[var(--muted-foreground)]">
        <div class="w-16 h-1.5 rounded-full bg-[var(--border)] overflow-hidden">
          <div id="progressFill" class="h-full w-0 bg-[#2B5B8E]"></div>
        </div>
        <span id="stageLabel" class="min-w-[110px]">準備中...</span>
      </div>

      <div class="flex items-center gap-1.5" title="クリックで色ごとに強調表示">
        <button class="swatch inline-flex items-center gap-1 px-2 py-0.5 rounded-full border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] cursor-pointer" data-filter="ink"><span class="w-2 h-2 rounded-full bg-[#2A303C]"></span>墨</button>
        <button class="swatch inline-flex items-center gap-1 px-2 py-0.5 rounded-full border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] cursor-pointer" data-filter="blue"><span class="w-2 h-2 rounded-full bg-[#2B5B8E]"></span>青</button>
        <button class="swatch inline-flex items-center gap-1 px-2 py-0.5 rounded-full border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] cursor-pointer" data-filter="green"><span class="w-2 h-2 rounded-full bg-[#3D7A4A]"></span>緑</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const svg = document.getElementById('scene');
      const stageGroups = Array.from(svg.querySelectorAll('g[data-stage]'));
      const btnReplay = document.getElementById('btnReplay');
      const btnPause = document.getElementById('btnPause');
      const btnInstant = document.getElementById('btnInstant');
      const stageLabel = document.getElementById('stageLabel');
      const progressFill = document.getElementById('progressFill');
      const swatches = Array.from(document.querySelectorAll('.swatch'));

      let isPaused = false;
      let animStartTime = 0;
      let elapsedBeforePause = 0;
      let totalDuration = 0;
      let rafId = null;
      let items = [];

      function buildTimeline() {
        items = [];
        let cursor = 0.15;
        stageGroups.forEach((group) => {
          const label = group.getAttribute('data-label') || '';
          const shapes = Array.from(group.querySelectorAll('path, line, circle, ellipse, rect, polyline'));
          const stageStart = cursor;
          let stageEnd = stageStart;

          shapes.forEach((el, idx) => {
            let len = 100;
            try { len = el.getTotalLength() || 100; } catch (_) {}
            const dur = Math.max(0.28, Math.min(1.25, len / 420));
            const stagger = Math.min(0.065, 0.85 / Math.max(shapes.length, 1));
            const start = stageStart + idx * stagger;
            const end = start + dur;
            if (end > stageEnd) stageEnd = end;

            el.style.strokeDasharray = `${len.toFixed(2)} ${len.toFixed(2)}`;
            el.style.strokeDashoffset = `${len.toFixed(2)}`;
            el.style.visibility = 'hidden';

            items.push({ el, len, start, dur, end, label });
          });

          cursor = Math.max(stageStart + 0.55, stageEnd - 0.35);
        });
        totalDuration = items.reduce((m, it) => Math.max(m, it.end), 1);
      }

      function ease(t) {
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      }

      function renderAt(tSec) {
        let activeLabel = '描画完了';
        for (let i = 0; i < items.length; i++) {
          const it = items[i];
          if (tSec <= it.start) {
            it.el.style.strokeDashoffset = it.len.toFixed(2);
            it.el.style.visibility = 'hidden';
          } else if (tSec >= it.end) {
            it.el.style.strokeDashoffset = '0';
            it.el.style.visibility = 'visible';
          } else {
            const p = ease((tSec - it.start) / it.dur);
            it.el.style.strokeDashoffset = (it.len * (1 - p)).toFixed(2);
            it.el.style.visibility = 'visible';
            activeLabel = it.label;
          }
        }
        const pct = Math.min(100, (tSec / totalDuration) * 100);
        progressFill.style.width = `${pct.toFixed(1)}%`;
        stageLabel.textContent = pct >= 100 ? '描画完了' : activeLabel;
      }

      function tick(now) {
        if (isPaused) return;
        const tSec = elapsedBeforePause + (now - animStartTime) / 1000;
        renderAt(tSec);
        if (tSec < totalDuration) {
          rafId = requestAnimationFrame(tick);
        } else {
          rafId = null;
          elapsedBeforePause = totalDuration;
          btnPause.textContent = '一時停止';
        }
      }

      function startAnimation() {
        if (rafId) cancelAnimationFrame(rafId);
        isPaused = false;
        elapsedBeforePause = 0;
        btnPause.textContent = '一時停止';
        renderAt(0);
        animStartTime = performance.now();
        rafId = requestAnimationFrame(tick);
      }

      btnReplay.addEventListener('click', startAnimation);
      btnPause.addEventListener('click', () => {
        if (elapsedBeforePause >= totalDuration && !rafId) {
          startAnimation();
          return;
        }
        if (!isPaused) {
          isPaused = true;
          if (rafId) cancelAnimationFrame(rafId);
          rafId = null;
          elapsedBeforePause += (performance.now() - animStartTime) / 1000;
          btnPause.textContent = '再開';
        } else {
          isPaused = false;
          btnPause.textContent = '一時停止';
          animStartTime = performance.now();
          rafId = requestAnimationFrame(tick);
        }
      });
      btnInstant.addEventListener('click', () => {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
        isPaused = false;
        elapsedBeforePause = totalDuration;
        renderAt(totalDuration);
      });

      let activeFilter = null;
      swatches.forEach((sw) => {
        sw.addEventListener('click', () => {
          const f = sw.dataset.filter;
          svg.classList.remove('filter-ink', 'filter-blue', 'filter-green');
          if (activeFilter === f) {
            activeFilter = null;
            swatches.forEach((s) => s.classList.remove('ring-1', 'ring-[var(--foreground)]'));
          } else {
            activeFilter = f;
            svg.classList.add(`filter-${f}`);
            swatches.forEach((s) => s.classList.toggle('ring-1', s === sw));
            swatches.forEach((s) => s.classList.toggle('ring-[var(--foreground)]', s === sw));
          }
        });
      });

      buildTimeline();
      startAnimation();
    })();
  </script>
